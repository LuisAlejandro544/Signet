name: Release & Pre-Release APK (Beta)

on:
  release:
    types: [published, created, prereleased]
  push:
    tags:
      - 'v*'
      - 'v*-B'
      - 'v*-dev'
      - 'v*-E'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag de la versión (ej: v1.0.0-B)'
        required: false
        default: 'v1.0.0-B'
      is_prerelease:
        description: 'Marcar como Pre-Release (Beta)'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release-apk:
    name: 🚀 Build & Sign Beta Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🐘 Setup Gradle Environment & Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
          cache-read-only: false

      - name: 🔑 Decode Keystore from Base64 Secret
        id: decode_keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BETA_BASE64 || secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p app
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decodificando KEYSTORE_BETA_BASE64 en app/signet-beta-key.jks..."
            echo "$KEYSTORE_BASE64" | base64 --decode > app/signet-beta-key.jks
            echo "keystore_ready=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ ADVERTENCIA: KEYSTORE_BETA_BASE64 no está configurado en GitHub Secrets."
            echo "Generando keystore temporal de contingencia para validar el build..."
            keytool -genkeypair -v \
              -keystore app/signet-beta-key.jks \
              -alias "signet-beta" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "fallback_store_password" \
              -keypass "fallback_key_password" \
              -dname "CN=Signet Beta Fallback, OU=CI Runner, O=Signet Project, C=US"
            echo "FALLBACK_USED=true" >> $GITHUB_ENV
            echo "keystore_ready=fallback" >> $GITHUB_OUTPUT
          fi

      - name: 🏷️ Resolve Effective Release Tag & Version
        id: resolve_version
        run: |
          INPUT_TAG="${{ inputs.tag_name }}"
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          REF_NAME="${{ github.ref_name }}"
          REF_TYPE="${{ github.ref_type }}"

          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ -n "$RELEASE_TAG" ]; then
            TAG="$RELEASE_TAG"
          elif [ "$REF_TYPE" = "tag" ] && [ -n "$REF_NAME" ]; then
            TAG="$REF_NAME"
          else
            TAG="v1.0.0-B"
          fi

          # Strip leading v / V for versionName
          VERSION_NAME="${TAG#v}"
          VERSION_NAME="${VERSION_NAME#V}"

          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "🎯 Tag efectivo resuelto: $TAG (versionName: $VERSION_NAME)"

      - name: 🐘 Ensure Gradle Wrapper & Permissions
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "ℹ️ ./gradlew no encontrado. Generando Gradle Wrapper 9.3.1..."
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x ./gradlew

      - name: 🔨 Build Release APK for Mobile Devices (ARM64-v8a & ARMeabi-v7a)
        env:
          KEYSTORE_PATH: signet-beta-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_BETA_PASSWORD || secrets.KEYSTORE_PASSWORD || 'fallback_store_password' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS_BETA || secrets.KEY_ALIAS || 'signet-beta' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD_BETA || secrets.KEY_PASSWORD || 'fallback_key_password' }}
          SIGNET_VERSION_NAME: ${{ env.VERSION_NAME }}
        run: |
          echo "Compilando APK optimizado para dispositivos móviles (ARM v7a / ARM64 v8a) con versión: $VERSION_NAME..."
          ./gradlew assembleRelease -PsignetTargetArch=mobile -PsignetVersionName="$VERSION_NAME" --stacktrace --no-daemon

      - name: 🔍 Inspect & Prepare Mobile Release Artifact
        id: prepare_mobile_artifacts
        run: |
          RELEASE_DIR="app/build/outputs/apk/release"
          APK_FILE=$(find "$RELEASE_DIR" -name "*.apk" -type f | head -n 1)
          
          if [ -z "$APK_FILE" ]; then
            echo "❌ Error: No se encontró ningún archivo APK móvil en $RELEASE_DIR"
            exit 1
          fi
          
          TAG="${{ env.TAG }}"
          DEST_NAME="Signet-${TAG}-release-signed.apk"
          cp "$APK_FILE" "./$DEST_NAME"
          
          echo "apk_path=./$DEST_NAME" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT
          
          echo "✅ APK móvil preparado: $DEST_NAME"

      - name: 🖥️ Build Dedicated Release APK for PC Emulators (x86 & x86_64)
        env:
          KEYSTORE_PATH: signet-beta-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_BETA_PASSWORD || secrets.KEYSTORE_PASSWORD || 'fallback_store_password' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS_BETA || secrets.KEY_ALIAS || 'signet-beta' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD_BETA || secrets.KEY_PASSWORD || 'fallback_key_password' }}
          SIGNET_VERSION_NAME: ${{ env.VERSION_NAME }}
        run: |
          echo "Limpiando directorio de release anterior para emulador..."
          rm -rf app/build/outputs/apk/release/*
          echo "Compilando APK dedicado y optimizado para emuladores de PC (x86 y x86_64) con versión: $VERSION_NAME..."
          ./gradlew assembleRelease -PsignetTargetArch=emulator -PsignetVersionName="$VERSION_NAME" --stacktrace --no-daemon

      - name: 🔍 Inspect & Prepare Emulator Release Artifact
        id: prepare_emulator_artifacts
        run: |
          RELEASE_DIR="app/build/outputs/apk/release"
          APK_FILE=$(find "$RELEASE_DIR" -name "*.apk" -type f | head -n 1)
          
          if [ -z "$APK_FILE" ]; then
            echo "❌ Error: No se encontró ningún archivo APK para emulador en $RELEASE_DIR"
            exit 1
          fi
          
          TAG="${{ env.TAG }}"
          DEST_NAME="Signet-${TAG}-emulator-x86-release-signed.apk"
          cp "$APK_FILE" "./$DEST_NAME"
          
          echo "apk_path=./$DEST_NAME" >> $GITHUB_OUTPUT
          
          echo "✅ APK emulador preparado: $DEST_NAME"

      - name: 📦 Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signet-beta-release-apks
          path: |
            ${{ steps.prepare_mobile_artifacts.outputs.apk_path }}
            ${{ steps.prepare_emulator_artifacts.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14

      - name: 🏷️ Attach Signed APKs to GitHub Release / Pre-Release
        if: (startsWith(github.ref, 'refs/tags/') || github.event_name == 'release') && github.event_name != 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_mobile_artifacts.outputs.tag_name }}
          prerelease: ${{ github.event.release.prerelease || inputs.is_prerelease || true }}
          files: |
            ${{ steps.prepare_mobile_artifacts.outputs.apk_path }}
            ${{ steps.prepare_emulator_artifacts.outputs.apk_path }}
          generate_release_notes: true
          body: |
            ## 🚀 Signet Beta Release (`${{ steps.prepare_mobile_artifacts.outputs.tag_name }}`)
            
            Este release corresponde al canal **Beta (`.beta`)** de Signet, compilado con optimización R8/ProGuard, empaquetado nativo eficiente en almacenamiento interno (`extractNativeLibs = false`) y firmado para distribución comunitaria.
            
            ### 📱 1. Paquete para Dispositivos Móviles (Teléfonos y Tablets)
            - **Archivo**: `${{ steps.prepare_mobile_artifacts.outputs.apk_path }}`
            - **Arquitecturas**: `arm64-v8a` (64 bits) y `armeabi-v7a` (32 bits).
            
            ### 🖥️ 2. Paquete Exclusivo para Emuladores de PC
            - **Archivo**: `${{ steps.prepare_emulator_artifacts.outputs.apk_path }}`
            - **Arquitecturas**: `x86_64` (64 bits) y `x86` (32 bits). Optimizado para Android Studio Emulator, BlueStacks, LDPlayer y entornos CI/CD en PC.
            
            ### 📦 Instalación
            Descarga la versión correspondiente a tu entorno e instálala (Android 7.0 / API 24 o superior).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📱 Send Release APKs to Private Telegram (MTProto / Bot API)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN_RELEASE_APK || secrets.TELEGRAM_BOT_TOKEN_DEBUG_APK || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID_RELEASE_APK || secrets.TELEGRAM_API_ID_DEBUG_APK || secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH_RELEASE_APK || secrets.TELEGRAM_API_HASH_DEBUG_APK || secrets.TELEGRAM_API_HASH }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_RELEASE_APK || secrets.TELEGRAM_CHAT_ID_DEBUG_APK || secrets.TELEGRAM_CHAT_ID }}
          MOBILE_APK_PATH: ${{ steps.prepare_mobile_artifacts.outputs.apk_path }}
          EMULATOR_APK_PATH: ${{ steps.prepare_emulator_artifacts.outputs.apk_path }}
          TAG_NAME: ${{ steps.prepare_mobile_artifacts.outputs.tag_name }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning ::Secretos de Telegram no configurados (TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID). Se omite el envío a Telegram."
            exit 0
          fi

          COMMIT_SHA="${GITHUB_SHA:0:7}"
          EVENT_TRIGGER="${{ github.event_name }}"

          if [ -n "$TELEGRAM_API_ID" ] && [ -n "$TELEGRAM_API_HASH" ]; then
            echo "==> Configurando Python y Telethon para envío masivo..."
            python3 -m pip install --quiet --upgrade telethon

            echo "==> Enviando Release APKs a Telegram por protocolo nativo MTProto..."
            python3 - << 'EOF'
          import os
          import sys
          import asyncio
          from telethon import TelegramClient

          api_id = int(os.environ['TELEGRAM_API_ID'])
          api_hash = os.environ['TELEGRAM_API_HASH']
          bot_token = os.environ['TELEGRAM_BOT_TOKEN']
          chat_id = int(os.environ['TELEGRAM_CHAT_ID'])
          mobile_apk = os.environ['MOBILE_APK_PATH']
          emulator_apk = os.environ['EMULATOR_APK_PATH']
          tag_name = os.environ.get('TAG_NAME', 'v1.0.0-B')
          commit_sha = os.environ.get('GITHUB_SHA', 'local')[:7]
          event_name = os.environ.get('GITHUB_EVENT_NAME', 'manual')

          async def send():
              client = TelegramClient('signet_release_telethon', api_id, api_hash)
              await client.start(bot_token=bot_token)
              
              caption_mobile = (
                  f"📱 **Signet Release APK (Móviles)**\n"
                  f"🏷️ **Versión**: `{tag_name}`\n"
                  f"⚙️ **Arquitectura**: ARM64-v8a / ARMeabi-v7a\n"
                  f"🔨 **Commit**: `{commit_sha}`\n"
                  f"⚡ **Disparador**: `{event_name}`"
              )
              print(f"Subiendo APK móvil {mobile_apk}...")
              await client.send_file(entity=chat_id, file=mobile_apk, caption=caption_mobile, parse_mode='md')
              
              if os.path.exists(emulator_apk):
                  caption_emu = (
                      f"🖥️ **Signet Release APK (Emuladores PC)**\n"
                      f"🏷️ **Versión**: `{tag_name}`\n"
                      f"⚙️ **Arquitectura**: x86_64 / x86\n"
                      f"🔨 **Commit**: `{commit_sha}`\n"
                      f"⚡ **Disparador**: `{event_name}`"
                  )
                  print(f"Subiendo APK emulador {emulator_apk}...")
                  await client.send_file(entity=chat_id, file=emulator_apk, caption=caption_emu, parse_mode='md')
                  
              await client.disconnect()
              print("¡APKs enviados exitosamente a Telegram!")

          asyncio.run(send())
          EOF
          else
            echo "==> Enviando Release APK móvil vía Telegram Bot API estándar..."
            CAPTION_MOBILE="📱 *Signet Release APK (Móviles)*\n🏷️ *Versión*: \`${TAG_NAME}\`\n⚙️ *Arch*: ARM64 / ARMv7"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F "chat_id=${TELEGRAM_CHAT_ID}" \
              -F "document=@${MOBILE_APK_PATH}" \
              -F "caption=${CAPTION_MOBILE}" \
              -F "parse_mode=Markdown"

            if [ -f "${EMULATOR_APK_PATH}" ]; then
              echo "==> Enviando Release APK emulador vía Telegram Bot API estándar..."
              CAPTION_EMU="🖥️ *Signet Release APK (Emulador PC)*\n🏷️ *Versión*: \`${TAG_NAME}\`\n⚙️ *Arch*: x86_64 / x86"
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
                -F "chat_id=${TELEGRAM_CHAT_ID}" \
                -F "document=@${EMULATOR_APK_PATH}" \
                -F "caption=${CAPTION_EMU}" \
                -F "parse_mode=Markdown"
            fi
          fi
