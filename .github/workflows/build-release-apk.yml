name: Release & Pre-Release APK (Beta)

on:
  release:
    types: [published, created, prereleased]
  push:
    tags:
      - 'v*'
      - 'v*-B'
      - 'v*-dev'
      - 'v*-E'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag de la versión (ej: v1.0.0-B)'
        required: false
        default: 'v1.0.0-B'
      is_prerelease:
        description: 'Marcar como Pre-Release (Beta)'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release-apk:
    name: 🚀 Build & Sign Beta Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🐘 Setup Gradle Environment & Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
          cache-read-only: false

      - name: 🔑 Decode Keystore from Base64 Secret
        id: decode_keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BETA_BASE64 || secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p app
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decodificando KEYSTORE_BETA_BASE64 en app/signet-beta-key.jks..."
            echo "$KEYSTORE_BASE64" | base64 --decode > app/signet-beta-key.jks
            echo "keystore_ready=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ ADVERTENCIA: KEYSTORE_BETA_BASE64 no está configurado en GitHub Secrets."
            echo "Generando keystore temporal de contingencia para validar el build..."
            keytool -genkeypair -v \
              -keystore app/signet-beta-key.jks \
              -alias "signet-beta" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "fallback_store_password" \
              -keypass "fallback_key_password" \
              -dname "CN=Signet Beta Fallback, OU=CI Runner, O=Signet Project, C=US"
            echo "FALLBACK_USED=true" >> $GITHUB_ENV
            echo "keystore_ready=fallback" >> $GITHUB_OUTPUT
          fi

      - name: 🐘 Ensure Gradle Wrapper & Permissions
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "ℹ️ ./gradlew no encontrado. Generando Gradle Wrapper 9.3.1..."
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x ./gradlew

      - name: 🔨 Build Release APK (R8 / ProGuard Minified & Shrunk)
        env:
          KEYSTORE_PATH: signet-beta-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_BETA_PASSWORD || secrets.KEYSTORE_PASSWORD || 'fallback_store_password' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS_BETA || secrets.KEY_ALIAS || 'signet-beta' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD_BETA || secrets.KEY_PASSWORD || 'fallback_key_password' }}
        run: |
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: 🔍 Inspect & Prepare Release Artifacts
        id: prepare_artifacts
        run: |
          RELEASE_DIR="app/build/outputs/apk/release"
          APK_FILE=$(find "$RELEASE_DIR" -name "*.apk" -type f | head -n 1)
          
          if [ -z "$APK_FILE" ]; then
            echo "❌ Error: No se encontró ningún archivo APK en $RELEASE_DIR"
            exit 1
          fi
          
          INPUT_TAG="${{ inputs.tag_name }}"
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          REF_NAME="${{ github.ref_name }}"
          REF_TYPE="${{ github.ref_type }}"

          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ -n "$RELEASE_TAG" ]; then
            TAG="$RELEASE_TAG"
          elif [ "$REF_TYPE" = "tag" ] && [ -n "$REF_NAME" ]; then
            TAG="$REF_NAME"
          else
            TAG="v1.0.0-B"
          fi
          DEST_NAME="Signet-${TAG}-release-signed.apk"
          cp "$APK_FILE" "./$DEST_NAME"
          
          SHA256_CHECKSUM=$(sha256sum "./$DEST_NAME" | awk '{print $1}')
          echo "$SHA256_CHECKSUM  $DEST_NAME" > "./$DEST_NAME.sha256"
          
          echo "apk_path=./$DEST_NAME" >> $GITHUB_OUTPUT
          echo "checksum_path=./$DEST_NAME.sha256" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT
          echo "sha256=$SHA256_CHECKSUM" >> $GITHUB_OUTPUT
          
          echo "✅ APK preparado: $DEST_NAME (SHA-256: $SHA256_CHECKSUM)"

      - name: 📦 Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: signet-beta-release-apk
          path: |
            ${{ steps.prepare_artifacts.outputs.apk_path }}
            ${{ steps.prepare_artifacts.outputs.checksum_path }}
          if-no-files-found: error
          retention-days: 14

      - name: 🏷️ Attach Signed APK to GitHub Release / Pre-Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_artifacts.outputs.tag_name }}
          prerelease: ${{ github.event.release.prerelease || inputs.is_prerelease || true }}
          files: |
            ${{ steps.prepare_artifacts.outputs.apk_path }}
            ${{ steps.prepare_artifacts.outputs.checksum_path }}
          generate_release_notes: true
          body: |
            ## 🚀 Signet Beta Release (`${{ steps.prepare_artifacts.outputs.tag_name }}`)
            
            Este archivo APK corresponde al canal **Beta (`.beta`)** de Signet, compilado con optimización R8/ProGuard y firmado para pruebas comunitarias previas al lanzamiento oficial.
            
            ### 🔐 Verificación Criptográfica de Integridad
            - **Archivo**: `${{ steps.prepare_artifacts.outputs.apk_path }}`
            - **SHA-256**: `${{ steps.prepare_artifacts.outputs.sha256 }}`
            
            ### 📦 Instalación
            Descarga el archivo APK adjunto e instálalo en tu dispositivo Android (Android 7.0 / API 24 o superior).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📱 Send Release APK to Private Telegram (MTProto / Bot API)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN_RELEASE_APK || secrets.TELEGRAM_BOT_TOKEN_DEBUG_APK || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID_RELEASE_APK || secrets.TELEGRAM_API_ID_DEBUG_APK || secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH_RELEASE_APK || secrets.TELEGRAM_API_HASH_DEBUG_APK || secrets.TELEGRAM_API_HASH }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_RELEASE_APK || secrets.TELEGRAM_CHAT_ID_DEBUG_APK || secrets.TELEGRAM_CHAT_ID }}
          APK_PATH: ${{ steps.prepare_artifacts.outputs.apk_path }}
          TAG_NAME: ${{ steps.prepare_artifacts.outputs.tag_name }}
          SHA256_SUM: ${{ steps.prepare_artifacts.outputs.sha256 }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning ::Secretos de Telegram no configurados (TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID). Se omite el envío a Telegram."
            exit 0
          fi

          COMMIT_SHA="${GITHUB_SHA:0:7}"
          EVENT_TRIGGER="${{ github.event_name }}"
          
          CAPTION="🚀 *Signet Release APK* (Canal \`.beta\`)\n🏷️ *Versión*: \`${TAG_NAME}\`\n🔨 *Commit*: \`${COMMIT_SHA}\`\n🔐 *SHA-256*: \`${SHA256_SUM}\`\n⚡ *Disparador*: \`${EVENT_TRIGGER}\`\n🛡️ *Optimización*: R8 / ProGuard Minificado & Firmado"

          if [ -n "$TELEGRAM_API_ID" ] && [ -n "$TELEGRAM_API_HASH" ]; then
            echo "==> Configurando Python y Telethon para envío masivo (soporta hasta 2GB)..."
            python3 -m pip install --quiet --upgrade telethon

            echo "==> Enviando Release APK a Telegram por protocolo nativo MTProto..."
            python3 - << 'EOF'
          import os
          import sys
          import asyncio
          from telethon import TelegramClient

          api_id = int(os.environ['TELEGRAM_API_ID'])
          api_hash = os.environ['TELEGRAM_API_HASH']
          bot_token = os.environ['TELEGRAM_BOT_TOKEN']
          chat_id = int(os.environ['TELEGRAM_CHAT_ID'])
          apk_path = os.environ['APK_PATH']
          tag_name = os.environ.get('TAG_NAME', 'v1.0.0-B')
          sha256 = os.environ.get('SHA256_SUM', '')
          commit_sha = os.environ.get('GITHUB_SHA', 'local')[:7]
          event_name = os.environ.get('GITHUB_EVENT_NAME', 'manual')

          async def send():
              client = TelegramClient('signet_release_telethon', api_id, api_hash)
              await client.start(bot_token=bot_token)
              
              caption = (
                  f"🚀 **Signet Release APK** (Canal `.beta`)\n"
                  f"🏷️ **Versión**: `{tag_name}`\n"
                  f"🔨 **Commit**: `{commit_sha}`\n"
                  f"🔐 **SHA-256**: `{sha256}`\n"
                  f"⚡ **Disparador**: `{event_name}`\n"
                  f"🛡️ **Optimización**: R8 / ProGuard Minificado & Firmado"
              )
              
              print(f"Subiendo archivo {apk_path} a Telegram...")
              await client.send_file(
                  entity=chat_id,
                  file=apk_path,
                  caption=caption,
                  parse_mode='md'
              )
              await client.disconnect()
              print("¡Release APK enviado exitosamente a tu Telegram!")

          asyncio.run(send())
          EOF
          else
            echo "==> Enviando Release APK vía Telegram Bot API estándar..."
            RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F "chat_id=${TELEGRAM_CHAT_ID}" \
              -F "document=@${APK_PATH}" \
              -F "caption=${CAPTION}" \
              -F "parse_mode=Markdown")
            
            echo "Respuesta de Telegram API: $RESPONSE"
            if echo "$RESPONSE" | grep -q '"ok":true'; then
              echo "¡APK enviado exitosamente por Bot API!"
            else
              echo "::warning ::Fallo al enviar APK por Bot API. Verifique los tokens y límites de tamaño."
            fi
          fi
