name: Build Debug APK & Dynamic KeyStore (Manual)

on:
  workflow_dispatch:
    inputs:
      generate_custom_key:
        description: 'Generar clave personalizada en el runner'
        required: false
        default: 'true'
        type: boolean

concurrency:
  group: build-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Download Code, Generate Key & Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Full Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17 with Gradle Cache
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Generate Dynamic Debug Keystore in Runner
        id: gen-key
        run: |
          echo "Generando Keystore criptográfico directamente en el runner de GitHub Actions..."
          mkdir -p keystores
          
          # Generar certificado RSA 2048 con validez extendida usando keytool nativo de JDK
          keytool -genkeypair \
            -v \
            -keystore keystores/generated-debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Keystore Generator Debug, OU=Mobile Dev, O=Uptodown Community, L=Madrid, ST=Madrid, C=ES"
          
          # Asegurar que esté disponible en la raíz del proyecto para signingConfigs
          cp keystores/generated-debug.keystore ./debug.keystore
          
          # Calcular huella digital SHA-256 de la clave generada
          echo "=== HUELLAS DIGITALES DE LA CLAVE GENERADA ==="
          keytool -list -v -keystore ./debug.keystore -alias androiddebugkey -storepass android | grep -E "SHA1:|SHA256:|MD5:"
          
          # Exportar a Base64 para logs de verificación
          echo "KEYSTORE_BASE64_LEN=$(base64 -w 0 ./debug.keystore | wc -c)" >> $GITHUB_OUTPUT
          echo "Keystore generado exitosamente."

      - name: Setup Gradle Environment & Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
          cache-read-only: false

      - name: Ensure Gradle Wrapper & Permissions
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "ℹ️ ./gradlew no encontrado en el repositorio. Generando Gradle Wrapper 9.3.1..."
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x ./gradlew

      - name: Compile & Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate and Verify Debug APK
        id: find-apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug/ -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No se encontró el archivo APK generado."
            exit 1
          fi
          echo "APK generado encontrado en: $APK_PATH"
          echo "Tamaño del APK: $(du -h "$APK_PATH" | cut -f1)"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Send Debug APK to Private Telegram (MTProto / Telethon up to 2GB)
        env:
          TELEGRAM_BOT_TOKEN_DEBUG_APK: ${{ secrets.TELEGRAM_BOT_TOKEN_DEBUG_APK }}
          TELEGRAM_API_ID_DEBUG_APK: ${{ secrets.TELEGRAM_API_ID_DEBUG_APK }}
          TELEGRAM_API_HASH_DEBUG_APK: ${{ secrets.TELEGRAM_API_HASH_DEBUG_APK }}
          TELEGRAM_CHAT_ID_DEBUG_APK: ${{ secrets.TELEGRAM_CHAT_ID_DEBUG_APK }}
          APK_PATH: ${{ steps.find-apk.outputs.apk_path }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN_DEBUG_APK" ] || [ -z "$TELEGRAM_API_ID_DEBUG_APK" ] || [ -z "$TELEGRAM_API_HASH_DEBUG_APK" ] || [ -z "$TELEGRAM_CHAT_ID_DEBUG_APK" ]; then
            echo "::warning ::Secretos de Telegram no configurados (TELEGRAM_BOT_TOKEN_DEBUG_APK, TELEGRAM_API_ID_DEBUG_APK, TELEGRAM_API_HASH_DEBUG_APK, TELEGRAM_CHAT_ID_DEBUG_APK). Omite el envío."
            exit 0
          fi

          echo "==> Configurando Python y Telethon para envío masivo (hasta 2GB)..."
          python3 -m pip install --quiet --upgrade telethon

          echo "==> Enviando APK a Telegram por protocolo nativo MTProto..."
          python3 - << 'EOF'
          import os
          import sys
          import asyncio
          from telethon import TelegramClient

          api_id = int(os.environ['TELEGRAM_API_ID_DEBUG_APK'])
          api_hash = os.environ['TELEGRAM_API_HASH_DEBUG_APK']
          bot_token = os.environ['TELEGRAM_BOT_TOKEN_DEBUG_APK']
          chat_id = int(os.environ['TELEGRAM_CHAT_ID_DEBUG_APK'])
          apk_path = os.environ['APK_PATH']

          async def send():
              client = TelegramClient('signet_telethon_bot', api_id, api_hash)
              await client.start(bot_token=bot_token)
              
              commit_sha = os.environ.get('GITHUB_SHA', 'local')[:7]
              caption = (
                  f"📦 **Signet Debug APK**\n"
                  f"🔨 **Commit**: `{commit_sha}`\n"
                  f"⚡ **Canal**: MTProto Telethon (Soporte hasta 2GB)\n"
                  f"🔒 **Estado**: Firmado y listo para pruebas privadas"
              )
              
              print(f"Subiendo archivo {apk_path} a Telegram...")
              await client.send_file(
                  entity=chat_id,
                  file=apk_path,
                  caption=caption,
                  parse_mode='md'
              )
              await client.disconnect()
              print("¡APK enviado exitosamente a tu chat privado de Telegram!")

          asyncio.run(send())
          EOF
